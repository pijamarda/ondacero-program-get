name: Download Mas de Uno episode

on:
  schedule:
    # Runs Monday–Friday at ~14:00 CEST / 12:00 UTC (same-day, after the 06:00–12:00 broadcast)
    # Off-minute (13) avoids GitHub's queued round-hour slots
    - cron: "13 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Programme date to fetch (YYYY-MM-DD). Leave empty for the latest."
        required: false
        default: ""

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run scraper
        env:
          DATE: ${{ inputs.date }}
        run: ./scraper.py ${DATE:+--date "$DATE"}

      - name: Upload to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: ./upload_dropbox.py
